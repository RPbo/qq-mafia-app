name: Build APK and AAB

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ключ подписи и Firebase
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Не задан секрет KEYSTORE_B64 (ключ подписи APK)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GS" ]; then
            echo "$GS" | base64 -d > app/google-services.json
            echo "Firebase подключён: push-уведомления включены"
          else
            echo "::warning::GOOGLE_SERVICES_JSON не задан: приложение соберётся без push-уведомлений"
          fi

      - name: Сборка release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Подготовить файлы
        run: |
          cp app/build/outputs/apk/release/app-release.apk qq-mafia.apk
          cp app/build/outputs/bundle/release/app-release.aab qq-mafia.aab

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QQ Mafia 1.0.${{ github.run_number }}
          body: |
            Сборка ${{ github.run_number }}.
            qq-mafia.aab — файл для загрузки в Google Play Console (обновления приходят через магазин).
            qq-mafia.apk — для ручной установки.
          files: |
            qq-mafia.apk
            qq-mafia.aab
          make_latest: true
